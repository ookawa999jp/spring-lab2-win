spring.application.name=spring-lab2-win
spring.datasource.url=jdbc:postgresql://127.0.0.1:5832/springlab
# 以下はローカル Docker PostgreSQL 向けの接続情報。
# 本番では環境変数またはクラウドの Secret 管理機能を使い、例えば
# spring.datasource.password=${DB_PASSWORD}
# のように参照すること。本番の ID / パスワードを Git に含めない。
spring.datasource.username=springuser
spring.datasource.password=springpass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
logging.file.name=logs/spring-lab2-win.log
# 以下はローカル検証用の JWT 設定。
# 本番では環境変数またはクラウドの Secret 管理機能を使い、例えば
# app.jwt.issuer=${JWT_ISSUER}
# app.jwt.secret=${JWT_SECRET}
# app.jwt.expires-in-seconds=${JWT_EXPIRES_IN_SECONDS}
# のように参照すること。本番の JWT issuer / secret / 有効期限を Git に含めない。
app.jwt.issuer=spring-lab2-win
app.jwt.secret=0123456789abcdef0123456789abcdef
app.jwt.expires-in-seconds=3600

mybatis.mapper-locations=classpath*:mybatis/**/*.xml
